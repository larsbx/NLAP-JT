name: finite-regime-core-audit

on:
  push:
  pull_request:

jobs:
  source-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run no-trig core audit
        run: python3 tools/audit_no_trig.py

      - name: Run no-points core audit
        run: python3 tools/audit_no_points.py

      - name: Run terminology governance audit
        run: python3 tools/audit_terminology.py

      - name: Run field-facing paper language audit
        run: python3 tools/audit_paper_language.py

      - name: Run backend manifest audit
        run: python3 tools/audit_backend_manifest.py

      - name: Run scaffold tests
        run: python3 -m pytest tests/test_scaffold.py tests/test_certificate_contracts.py tests/test_interval_exclusion_reference.py tests/test_interval_orbit_scaffold.py tests/test_krawczyk_joint_scaffold.py tests/test_poly_interval_eval.py tests/test_complex_inverse.py tests/test_vertex_incidence.py tests/test_certificate_incidence.py tests/test_misiurewicz_certificate.py tests/test_coord_record_eval.py tests/test_proof_grade_gate.py tests/test_backend_migration.py tests/test_backend_manifest.py tests/test_rank2_operator.py tests/test_rank2_no_circle.py tests/test_terminology_governance.py tests/test_terminology_registry.py tests/test_terminology_use_manifest.py tests/test_alignment_audit_incorporation.py tests/test_mojo_optimization_contract.py tests/test_mojo_theorem_kernel.py tests/test_C1_proof_criterion.py tests/test_paper_manuscript.py tests/test_paper_language_linter.py tests/test_canonical_serialization.py tests/test_top_conjecture_focus.py tests/test_separation_grammar.py tests/test_C1_bridge.py tests/test_C1_fair_enumeration.py tests/test_C1_separator_codes.py tests/test_C1_finite_separation.py tests/test_C1_side_assignment.py tests/test_C1_side_assignment_soundness.py tests/test_C1_wake_membership.py tests/test_C1_opposite_side_separation.py tests/test_C1_finite_prefix_existential.py tests/test_C1_classical_to_finite.py tests/test_C1_rational_separator_coding.py tests/test_C1_proof_barrier.py tests/test_C1_persistent_nonseparation.py tests/test_C1_wake_ambiguity.py tests/test_C1_wake_ambiguity_elimination.py tests/test_C1_unresolved_wake_carrier.py tests/test_C1_carrier_refinement_progress.py tests/test_C1_carrier_progress_dichotomy.py tests/test_C1_strict_carrier_refinement_wellfounded.py tests/test_C1_no_renaming_refinement.py tests/test_C1_canonical_carrier_content.py tests/test_C1_canonical_content_refinement_order.py tests/test_C1_theorem_status.py tests/test_C1_residual_frontier_refinement.py tests/test_C1_residual_descent_contradiction.py tests/test_C1_exit_closure_for_C1.py

      - name: Run polynomial reference oracle
        run: python3 tools/poly_reference.py

      - name: Run interval exclusion reference oracle
        run: python3 tools/interval_exclusion_reference.py
