name: finite-regime-core-audit

on:
  push:
  pull_request:

jobs:
  source-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run no-trig core audit
        run: python3 tools/audit_no_trig.py

      - name: Run scaffold tests
        run: python3 -m pytest tests/test_scaffold.py tests/test_certificate_contracts.py tests/test_interval_exclusion_reference.py tests/test_interval_orbit_scaffold.py tests/test_krawczyk_joint_scaffold.py tests/test_poly_interval_eval.py tests/test_complex_inverse.py

      - name: Run polynomial reference oracle
        run: python3 tools/poly_reference.py

      - name: Run interval exclusion reference oracle
        run: python3 tools/interval_exclusion_reference.py
