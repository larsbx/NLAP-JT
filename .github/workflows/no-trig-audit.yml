name: finite-regime-core-audit

on:
  push:
  pull_request:

jobs:
  source-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run no-trig core audit
        run: python3 tools/audit_no_trig.py

      - name: Run scaffold tests
        run: python3 -m pytest tests/test_scaffold.py tests/test_certificate_contracts.py
