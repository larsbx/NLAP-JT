name: finite-regime-core-audit

on:
  push:
  pull_request:

jobs:
  source-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          cache: true

      - name: Compile Mojo smoke target
        run: pixi run mojo-build

      - name: Run Mojo smoke target
        run: pixi run mojo-smoke

      - name: Run exact-arithmetic property probe against the Python oracle
        run: pixi run property

      - name: Run no-trig core audit
        run: python3 tools/audit_no_trig.py

      - name: Run no-points core audit
        run: python3 tools/audit_no_points.py

      - name: Run test suite
        run: pixi run test

      - name: Run terminology governance audit
        run: python3 tools/audit_terminology.py

      - name: Check vendored claim-governance package against vendored.toml
        run: python3 tools/check_vendored_sync.py

      - name: Run claim governance audit (claim_governance.toml)
        run: PYTHONPATH=tools python3 -m claim_governance.cli --root .

      - name: Run field-facing paper language audit
        run: python3 tools/audit_paper_language.py

      - name: Run backend manifest audit
        run: python3 tools/audit_backend_manifest.py

      - name: Run exact arithmetic audit
        run: python3 tools/audit_exact_arithmetic.py

      - name: Run polynomial reference oracle
        run: python3 tools/poly_reference.py

      - name: Run interval exclusion reference oracle
        run: python3 tools/interval_exclusion_reference.py
