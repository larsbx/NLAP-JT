name: finite-regime-core-audit

on:
  push:
  pull_request:

jobs:
  source-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run no-trig core audit
        run: python3 tools/audit_no_trig.py

      - name: Run no-points core audit
        run: python3 tools/audit_no_points.py

      - name: Run backend manifest audit
        run: python3 tools/audit_backend_manifest.py

      - name: Run scaffold tests
        run: python3 -m pytest tests/test_scaffold.py tests/test_certificate_contracts.py tests/test_interval_exclusion_reference.py tests/test_interval_orbit_scaffold.py tests/test_krawczyk_joint_scaffold.py tests/test_poly_interval_eval.py tests/test_complex_inverse.py tests/test_vertex_incidence.py tests/test_certificate_incidence.py tests/test_misiurewicz_certificate.py tests/test_coord_record_eval.py tests/test_proof_grade_gate.py tests/test_backend_migration.py tests/test_backend_manifest.py tests/test_rank2_operator.py tests/test_canonical_serialization.py tests/test_top_conjecture_focus.py tests/test_separation_grammar.py tests/test_C1_bridge.py tests/test_C1_fair_enumeration.py tests/test_C1_separator_codes.py tests/test_C1_finite_separation.py tests/test_C1_side_assignment.py tests/test_C1_side_assignment_soundness.py tests/test_C1_wake_membership.py tests/test_C1_opposite_side_separation.py

      - name: Run polynomial reference oracle
        run: python3 tools/poly_reference.py

      - name: Run interval exclusion reference oracle
        run: python3 tools/interval_exclusion_reference.py
